tier_2_institutional:
  arxiv:
    polling: "weekly"
    notes: |
      Search-query feeds instead of broad category feeds. Cuts noise at the
      source so we don't pay for triage on EEG-emotion-recognition papers.
      Query syntax is the arXiv API search grammar:
      https://info.arxiv.org/help/api/user-manual.html#query_details
    searches:
      - label: "labor & automation"
        query: '(cat:econ.GN OR cat:cs.CY) AND (all:automation OR all:labor OR all:displacement OR all:workforce OR all:productivity OR all:"task share")'

      - label: "AI governance & policy"
        query: 'cat:cs.CY AND (all:governance OR all:regulation OR all:policy OR all:liability OR all:audit OR all:antitrust)'

      - label: "alignment, safety, evaluation"
        query: '(cat:cs.CY OR cat:cs.AI) AND (all:alignment OR all:"AI safety" OR all:evaluation OR all:"red team" OR all:"open-weight" OR all:"frontier model" OR all:oversight)'

      - label: "truth & misinformation"
        query: 'cat:cs.CY AND (all:misinformation OR all:disinformation OR all:provenance OR all:watermark OR all:deepfake OR all:"content authenticity")'

      - label: "human cognition & education"
        query: '(cat:cs.CY OR cat:cs.HC) AND (all:education OR all:cognitive OR all:metacognition OR all:scaffold OR all:deskilling OR all:"sensitive period")'

  nber:
    feed_url: "https://www.nber.org/rss/new.xml"
    polling: "daily"
    notes: "Working papers. Watch for labor, productivity, innovation series."

  imf_working_papers:
    feed_url: "https://www.imf.org/en/Publications/RSS?type=WP"
    polling: "weekly"
    notes: "Lower volume but high-quality labor/macro papers."

  brookings:
    feeds:
      - url: "https://www.brookings.edu/topic/artificial-intelligence/feed/"
        label: "AI topic"
      - url: "https://www.brookings.edu/topic/technology-policy/feed/"
        label: "Tech policy"
    polling: "daily"

  lab_blogs:
    - name: "Anthropic"
      feed_url: "https://www.anthropic.com/research/rss.xml"
      alternate_url: "https://www.anthropic.com/news/rss.xml"
      priority: "high"
      notes: "RSP updates, safety research, policy positions"

    - name: "OpenAI"
      feed_url: "https://openai.com/blog/rss.xml"
      priority: "high"
      notes: "Policy papers, capability announcements, governance"

    - name: "Google DeepMind"
      feed_url: "https://deepmind.google/blog/rss.xml"
      priority: "medium"

    - name: "Meta AI (FAIR)"
      feed_url: "https://ai.meta.com/blog/rss/"
      priority: "medium"
      notes: "Open-weight model releases relevant to Essay 6 governance"

  policy_institutes:
    - name: "CSET Georgetown"
      feed_url: "https://cset.georgetown.edu/feed/"
      notes: "AI policy analysis, workforce, national security"

    - name: "AI Now Institute"
      feed_url: "https://ainowinstitute.org/feed"
      notes: "Power concentration, labor, accountability"

    - name: "RAND AI"
      url: "https://www.rand.org/topics/artificial-intelligence.html"
      notes: "No RSS; scrape or poll. National security, governance."

    - name: "Center for AI Safety"
      url: "https://www.safe.ai/research"
      notes: "Catastrophic risk, alignment research"

    - name: "Partnership on AI"
      feed_url: "https://partnershiponai.org/feed/"
      notes: "Multi-stakeholder governance perspectives"

  religious_and_ethical:
    - name: "Vatican News"
      feed_url: "https://www.vaticannews.va/en.rss.xml"
      notes: |
        High-volume general Vatican news; TF-IDF filter will only surface
        AI/governance/labor-relevant items. Added after Pope Leo XIV's
        "Magnifica Humanitas" encyclical (May 2026) slipped past our
        other sources.

  government_regulatory:
    - name: "EU AI Act tracker"
      url: "https://artificialintelligenceact.eu"
      notes: "Regulatory implementation updates for Essay 6"

    - name: "NIST AI"
      url: "https://www.nist.gov/artificial-intelligence"
      notes: "Standards, risk framework updates"

    - name: "UK AISI"
      url: "https://www.aisi.gov.uk/research"
      notes: "Safety evaluations, frontier model assessments"

tier_3_editorial:
  journals:
    - name: "Science"
      feed_url: "https://www.science.org/action/showFeed?type=etoc&feed=rss&jc=science"
      filter_keywords: ["artificial intelligence", "machine learning", "automation", "labor"]

    - name: "Nature"
      feed_url: "https://www.nature.com/nature.rss"
      filter_keywords: ["AI", "artificial intelligence", "automation", "large language model"]

  magazines_and_reviews:
    - name: "Foreign Affairs"
      url: "https://www.foreignaffairs.com/topics/science-technology"
      notes: "Geopolitical AI dimensions, governance. No RSS; poll."

    - name: "Harvard Business Review"
      feed_url: "https://hbr.org/topic/technology.rss"
      filter_keywords: ["AI", "artificial intelligence", "automation", "generative"]

    - name: "MIT Technology Review"
      feed_url: "https://www.technologyreview.com/feed/"
      notes: "Selective; watch for policy and labor pieces, skip product reviews."

    - name: "The Economist"
      url: "https://www.economist.com/science-and-technology"
      notes: "Occasional deep pieces on AI governance, labor displacement."

  newsletters_and_blogs:
    - name: "Import AI (Jack Clark)"
      url: "https://importai.substack.com/feed"
      notes: "Tier 1 author but newsletter format; treat as editorial."

    - name: "New Things Under the Sun (Matt Clancy)"
      url: "https://mattsclancy.substack.com/feed"
      notes: "Innovation economics, science of science. Tier 1 author."

    - name: "Cold Takes (Holden Karnofsky)"
      url: "https://www.cold-takes.com/feed"
      notes: "AI safety, transformative AI timelines."

    - name: "Hyperdimensional (Dean Ball)"
      url: "https://www.hyperdimensional.co/feed"
      notes: "Regulatory skepticism counterpoint for Essay 6."

    - name: "One Useful Thing (Ethan Mollick)"
      url: "https://www.oneusefulthing.org/feed"
      notes: "AI in practice, education, capability assessments."

    - name: "Noahpinion (Noah Smith)"
      url: "https://noahpinion.substack.com/feed"
      notes: "Economics of AI, labor, industrial policy."

# Polling configuration
defaults:
  polling_interval: "daily"
  max_items_per_feed: 20
  timeout_seconds: 30
  retry_attempts: 3
  user_agent: "Observatory/1.0 (research-monitor; +shadesofsingularity.com)"
