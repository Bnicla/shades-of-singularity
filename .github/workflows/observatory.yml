name: Observatory weekly scan

# Runs the research-monitor pipeline once a week, then pushes the rendered
# HTML digest into Vercel KV. The Vercel serve function (/observatory)
# reads from KV and returns the latest digest to visitors.
#
# This lives on GitHub Actions instead of Vercel Cron because the pipeline
# can take 5-15 minutes to complete (40+ feeds + LLM calls), which exceeds
# Vercel's serverless function duration limits.
#
# Weekly cadence keeps total LLM call volume comfortably inside Gemini's
# free-tier daily quota. Academic + policy material doesn't move fast
# enough to need daily scans.

on:
  schedule:
    - cron: '0 10 * * 1'   # Mondays 10:00 UTC (06:00 ET / 12:00 CET)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline mode'
        type: choice
        required: false
        default: 'weekly'
        options:
          - weekly
          - backfill
          - scan-essays
          - inject
      inject_url:
        description: '[inject mode] URL of the item to inject'
        required: false
      inject_title:
        description: '[inject mode] Title of the card'
        required: false
      inject_signal:
        description: '[inject mode] Where to file it'
        type: choice
        required: false
        default: 'pending'
        options:
          - pending
          - integrated
          - useful_later
          - noise
      inject_summary:
        description: '[inject mode] Summary text (optional)'
        required: false
      inject_source:
        description: '[inject mode] Source label, e.g. "Vatican News" (optional)'
        required: false

# Prevent overlapping runs (e.g. if a long run is in progress when the next cron fires)
concurrency:
  group: observatory-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: observatory/requirements.txt

      - name: Install dependencies
        run: pip install -r observatory/requirements.txt

      - name: Run observatory pipeline
        working-directory: observatory
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          MODE: ${{ inputs.mode || 'weekly' }}
          INJECT_URL: ${{ inputs.inject_url }}
          INJECT_TITLE: ${{ inputs.inject_title }}
          INJECT_SIGNAL: ${{ inputs.inject_signal || 'pending' }}
          INJECT_SUMMARY: ${{ inputs.inject_summary }}
          INJECT_SOURCE: ${{ inputs.inject_source }}
        run: |
          if [ "$MODE" = "backfill" ]; then
            python src/pipeline.py --production --backfill
          elif [ "$MODE" = "scan-essays" ]; then
            python src/scan_essays.py --production
          elif [ "$MODE" = "inject" ]; then
            if [ -z "$INJECT_URL" ] || [ -z "$INJECT_TITLE" ]; then
              echo "inject mode requires both inject_url and inject_title"
              exit 1
            fi
            python src/inject_card.py --production \
              --url     "$INJECT_URL" \
              --title   "$INJECT_TITLE" \
              --signal  "$INJECT_SIGNAL" \
              --summary "$INJECT_SUMMARY" \
              --source  "$INJECT_SOURCE"
            # Re-render so the new card shows up immediately
            python src/pipeline.py --production
          else
            python src/pipeline.py --production
          fi
